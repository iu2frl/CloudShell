name: Unit Tests (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        type: string
        default: "3.12"

jobs:
  unit-tests:
    name: Backend unit tests (pytest)
    runs-on: ubuntu-latest

    env:
      DATA_DIR: /tmp/cloudshell-test-${{ github.run_id }}
      SECRET_KEY: ci-test-secret
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      TOKEN_TTL_HOURS: "1"
      AUDIT_RETENTION_DAYS: "7"
      CORS_ORIGINS: "*"
      APP_VERSION: "ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run pytest with coverage
        run: python -m pytest

      - name: Write coverage summary to job summary
        if: always()
        run: |
          echo "## Backend Unit Test Coverage (Python ${{ inputs.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if python -m coverage report --rcfile=pytest.ini >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            :
          elif python -m coverage report >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            :
          else
            echo "Coverage data not available" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/coverage.xml ]; then
            python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os

          tree = ET.parse("reports/coverage.xml")
          root = tree.getroot()
          line_rate = float(root.attrib.get("line-rate", 0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0)) * 100

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          with open(summary, "a") as f:
              f.write("\n")
              f.write(f"| Metric | Value |\n")
              f.write(f"|--------|-------|\n")
              f.write(f"| Line coverage   | {line_rate:.1f}% |\n")
              f.write(f"| Branch coverage | {branch_rate:.1f}% |\n")
          EOF
          fi
        env:
          COVERAGE_FILE: .coverage

      - name: Enumerate API endpoints and append to job summary
        if: always()
        run: |
          echo "## API Endpoints" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Run the endpoint lister and append its Markdown table to the summary
          python3 scripts/list_endpoints.py >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || python3 -m scripts.list_endpoints >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Failed to enumerate endpoints" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish JUnit test results artifact
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: junit-results-py${{ inputs.python-version }}
          path: reports/junit.xml
          retention-days: 30

      - name: Publish coverage report artifact
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-report-py${{ inputs.python-version }}
          path: reports/
          retention-days: 30

      - name: Publish test results check (PR only)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          files: reports/junit.xml
          check_name: "Unit Test Results (Python ${{ inputs.python-version }})"
          comment_mode: always
          report_individual_runs: true
          github_token: ${{ github.token }}
